name: Pruebas

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar jsdom (única dependencia, solo para pruebas)
        run: npm install
      - name: Ejecutar las diez baterías
        run: npm test
